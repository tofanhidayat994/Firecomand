<script>
(function(){
'use strict';
/* ---------- util ---------- */
const $=(s,e)=>(e||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const D=864e5;
const mem={};
const ls=(()=>{
  let db=null,tm=0;const q=new Map();
  const flush=()=>{tm=0;const items=[...q];q.clear();if(!items.length)return;
    if(db){try{const st=db.transaction('kv','readwrite').objectStore('kv');items.forEach(([k,v])=>v===undefined?st.delete(k):st.put(v,k))}catch(e){}}
    else items.forEach(([k,v])=>{try{if(v===undefined)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}})};
  const queue=(k,v)=>{q.set(k,v);if(!tm)tm=setTimeout(flush,40)};
  return{
    get(k,d){return k in mem?mem[k]:d},
    set(k,v){mem[k]=v;queue(k,v)},
    del(k){delete mem[k];queue(k,undefined)},
    flushNow:flush,
    init(){return new Promise(res=>{
      const fb=()=>{try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('fc_'))try{mem[k]=JSON.parse(localStorage.getItem(k))}catch(e){}}}catch(e){}res()};
      if(!window.indexedDB)return fb();
      let rq;try{rq=indexedDB.open('fire-command',1)}catch(e){return fb()}
      rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
      rq.onerror=fb;
      rq.onsuccess=()=>{db=rq.result;try{const c=db.transaction('kv').objectStore('kv').openCursor();
        c.onsuccess=()=>{const cu=c.result;if(cu){mem[cu.key]=cu.value;cu.continue()}else res()};c.onerror=()=>res()}catch(e){res()}}
    })}
  };
})();
const uid=()=>'r'+Date.now().toString(36)+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>(b%36).toString(36)).join('');
const tz='Asia/Jakarta';
const fmt=ts=>new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz}).format(ts);
const fmtT=ts=>new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz}).format(ts);
const fmtD=ts=>new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'numeric',timeZone:tz}).format(ts);
const nowLocal=()=>{const d=new Date(Date.now()+7*36e5);return d.toISOString().slice(0,16)};
const fromLocal=v=>{const t=Date.parse(v+':00+07:00');return isNaN(t)?Date.now():t};
const sameDay=(a,b)=>new Intl.DateTimeFormat('en-CA',{timeZone:tz}).format(a)===new Intl.DateTimeFormat('en-CA',{timeZone:tz}).format(b);
const greet=()=>{const h=+new Intl.DateTimeFormat('en-GB',{hour:'2-digit',hour12:false,timeZone:tz}).format(new Date());return h<11?'Selamat Pagi':h<15?'Selamat Siang':h<18?'Selamat Sore':'Selamat Malam'};

/* ---------- icons ---------- */
const ICON={
home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
sync:'<path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2M18 2v4h-4M6 22v-4h4"/>',

async function pushRec(rec){
  const paths=[];
  for(let i=0;i<(rec.photos||[]).length;i++){const p=rec.photos[i];
    if(String(p).startsWith('data:')){const path=me.id+'/'+rec.id+'/'+i+'.jpg',{error}=await sb.storage.from('foto').upload(path,dataBlob(p),{upsert:true,contentType:'image/jpeg'});if(error)throw error;paths.push(path)}
    else paths.push(p)}
  if(rec.type!=='api'){const {error}=await sb.from('laporan').upsert(rec2row(rec,paths),{onConflict:'id'});if(error)throw error;return}
  for(let k=0;k<4;k++){
    const {data:cur,error:e1}=await sb.from('laporan').select('*').eq('id',rec.id).maybeSingle();
    if(e1)throw e1;
    if(!cur){const {error}=await sb.from('laporan').insert(rec2row(rec,paths));if(!error)return;if(error.code==='23505')continue;throw error}
    const m=mergeApi(row2rec(cur),rec,paths),row=rec2row(m,m.photos);
    const {data:u,error:e2}=await sb.from('laporan').update({data:row.data,foto:row.foto,pembaruan:row.pembaruan,regu:row.regu,alat:row.alat}).eq('id',rec.id).eq('diubah_pada',cur.diubah_pada).select('id');
    if(e2)throw e2;if(u&&u.length)return;
  }
  throw new Error('Laporan sedang diubah rekan lain. Coba sinkron lagi.');
}

async function pull(){

    while(more&&guard++<60){

      const {data,error}=await q;if(error)throw error;

    const lim=Date.now()-400*D;

      if(i>=0&&lcl[i].status==='synced'){const keep=(lcl[i].photos||[]).some(x=>String(x).startsWith('data:'));if(keep)r.photos=lcl[i].photos;lcl[i]=r;ch=true}

      ls.set('fc_lvhist',h);if(h[0]){ls.set('fc_level',h[0]);if(cur&&before!==h[0].k&&h[0].by!==prof().name)addNotif({kind:'Penting',title:'Level kesiagaan: '+lvOf(h[0].k).n,sub:'Diubah oleh '+h[0].by+(h[0].note?' · '+h[0].note:'')})}}

async function doSync(manual){

  if(done){addNotif({title:done+' laporan berhasil dikirim',sub:'Data sudah diterima server dan terlihat oleh personel lain.'});toast(done+' laporan terkirim.')}

  soft();
}

const urlCache={},inflight={};
function psrc(p){
  p=String(p||'');if(!p)return BLANK;
  if(p.startsWith('data:')||p.startsWith('http'))return p;
  const c=urlCache[p];if(c&&c.exp>Date.now())return c.u;

}
async function fetchUrl(p){
  if(!sb||!online()||inflight[p])return;inflight[p]=1;
  try{const {data}=await sb.storage.from('foto').createSignedUrl(p,3600);
    if(data&&data.signedUrl){urlCache[p]={u:data.signedUrl,exp:Date.now()+3300e3};if(['detail','kej'].includes(S.view)&&!S.sheet)render()}}catch(e){}
  delete inflight[p];

const MARK=[{k:'m1',t:'menara',n:'Menara 1',x:64,y:46},{k:'m2',t:'menara',n:'Menara 2',x:262,y:116},{k:'m3',t:'menara',n:'Menara 3',x:130,y:214},{k:'m4',t:'menara',n:'Menara 4',x:300,y:236},
 {k:'h1',t:'hujan',n:'Pos 1',x:196,y:56},{k:'h2',t:'hujan',n:'Pos 2',x:52,y:150},{k:'h3',t:'hujan',n:'Pos 3',x:178,y:150}];
const cell=b=>{const i=BLK.indexOf(b);return {x:18+(i%3)*108,y:16+Math.floor(i/3)*88}};
function mapSvg(pick,ff){
  const fires=activeFires(),fb=new Set(fires.map(f=>f.data.lokasi));
  let s=`<svg viewBox="0 0 360 296" width="100%" role="img" aria-label="Peta skematik area operasional" style="display:block;border-radius:10px;background:var(--bg);border:1px solid var(--line)">`;
  BLK.forEach(b=>{const c=cell(b),hot=fb.has(b);
    s+=`<g ${pick?`data-act="pickblock" data-b="${b}" style="cursor:pointer"`:''}><rect x="${c.x+2}" y="${c.y+2}" width="104" height="84" rx="7" style="fill:${hot?'var(--red-soft)':'var(--green-soft)'};stroke:${hot?'var(--red)':'var(--line)'};stroke-width:${hot?1.5:1}"/><text x="${c.x+10}" y="${c.y+18}" style="fill:var(--muted);font-size:11px;font-weight:600">${b}</text></g>`});
  s+=`<path d="M18 268 C80 236 120 284 190 256 S300 236 342 268" fill="none" style="stroke:var(--blue)" stroke-width="3" stroke-linecap="round" opacity=".55"/>`;
  if(!pick){
    if(!ff)s+=`<polyline points="${['Blok A1','Blok A2','Blok B2','Blok B3','Blok C3'].map(b=>{const c=cell(b);return (c.x+54)+','+(c.y+44)}).join(' ')}" fill="none" style="stroke:var(--amber)" stroke-width="2" stroke-dasharray="5 4"/>`;
    const f=ff||S.mapf;
    MARK.filter(m=>f==='Semua'||(f==='Menara'&&m.t==='menara')||(f==='Hujan'&&m.t==='hujan')).forEach(m=>{
      s+=`<g data-act="mk" data-k="${m.k}" style="cursor:pointer" role="button" aria-label="${m.n}"><circle cx="${m.x}" cy="${m.y}" r="12" style="fill:${m.t==='menara'?'var(--blue)':'var(--c5)'};stroke:var(--surface)" stroke-width="2"/><text x="${m.x}" y="${m.y+4}" text-anchor="middle" style="fill:#fff;font-size:11px;font-weight:700">${m.t==='menara'?'M'+m.n.slice(-1):'H'+m.n.slice(-1)}</text></g>`});
    if(f==='Semua'||f==='Kebakaran')fires.filter(a=>BLK.includes(a.data.lokasi)).forEach(a=>{const c=cell(a.data.lokasi);
      s+=`<g data-act="mk" data-k="${a.id}" style="cursor:pointer" role="button" aria-label="${esc(title(a))}"><circle cx="${c.x+54}" cy="${c.y+50}" r="14" style="fill:var(--red);stroke:var(--surface)" stroke-width="2"/><text x="${c.x+54}" y="${c.y+55}" text-anchor="middle" style="fill:#fff;font-size:14px;font-weight:700">!</text></g>`});
  }

}

/* ---------- charts ---------- */
function niceMax(x){x=Math.max(x,1);const p=Math.pow(10,Math.floor(Math.log10(x))),n=x/p;return (n<=2?2:n<=4?4:n<=6?6:n<=8?8:10)*p}
function barChart(v,l,col){
  const mx=niceMax(Math.max(...v)),W=340,H=170,L=30,B=24,T=12,pw=W-L-6,ph=H-B-T,bw=pw/v.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grafik batang">`;
  [0,.5,1].forEach(f=>{const y=T+ph-f*ph;s+=`<line x1="${L}" x2="${W-6}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${L-5}" y="${y+4}" text-anchor="end" style="fill:var(--muted);font-size:10px">${Math.round(mx*f)}</text>`});
  v.forEach((x,i)=>{const h=x/mx*ph,bx=L+i*bw+bw*.18,w=bw*.64;
    s+=`<rect x="${bx}" y="${T+ph-h}" width="${w}" height="${Math.max(h,1)}" rx="3" style="fill:${col||'var(--blue)'}"/>${x>0?`<text x="${bx+w/2}" y="${T+ph-h-4}" text-anchor="middle" style="fill:var(--fg);font-size:10px;font-weight:600">${x}</text>`:''}<text x="${bx+w/2}" y="${H-7}" text-anchor="middle" style="fill:var(--muted);font-size:10px">${l[i]}</text>`});
  return s+'</svg>';
}
function donut(parts,total){
  const R=40,C=2*Math.PI*R;let off=0,s=`<svg viewBox="0 0 120 120" width="132" height="132" role="img" aria-label="Diagram komposisi"><g transform="rotate(-90 60 60)">`;
  if(!total)s+=`<circle cx="60" cy="60" r="${R}" fill="none" style="stroke:var(--line)" stroke-width="16"/>`;
  parts.forEach((p,i)=>{const len=total?p.n/total*C:0;if(len>0)s+=`<circle cx="60" cy="60" r="${R}" fill="none" style="stroke:${p.c||'var(--c'+(i+1)+')'}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`;off+=len});
  return s+`</g><text x="60" y="58" text-anchor="middle" style="fill:var(--muted);font-size:9px">Total</text><text x="60" y="76" text-anchor="middle" style="fill:var(--fg);font-size:20px;font-weight:700">${total}</text></svg>`;
}

function parseCoord(t){
  t=String(t||'').trim();if(!t)return null;
  let m=t.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/)||t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)||t.match(/[?&](?:q|ll|query|center|destination)=(-?\d+(?:\.\d+)?)(?:,|%2C)(-?\d+(?:\.\d+)?)/i);
  if(!m&&/^https?:/i.test(t))return null;
  if(!m)m=t.match(/(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)/);
  if(!m)return null;
  const la=parseFloat(m[1].replace(',','.')),lo=parseFloat(m[2].replace(',','.'));

}

}

  return `<div class="auth"><div style="text-align:center"><div style="display:inline-block;background:var(--hdr);border-radius:18px;padding:12px">${logo(58)}</div></div><div><h1>Fire Command</h1><p class="muted" style="text-align:center;margin:4px 0 0">Damkar Lahan</p></div>
  ${cfgOk&&window.supabase?'':'<div class="hint"><b>Belum terhubung ke database.</b> Isi SUPABASE_URL dan SUPABASE_ANON_KEY di config.js (lihat README).</div>'}
  <button class="btn gbtn" data-act="gsignin" ${cfgOk&&window.supabase?'':'disabled'}><b style="font-size:18px;color:#4285F4">G</b> Masuk dengan Google</button>
  ${S.authMsg?`<div class="err" role="alert" style="text-align:center">${esc(S.authMsg)}</div>`:''}
  <p class="muted small" style="text-align:center;margin:0">Hanya akun yang sudah disetujui admin yang dapat melihat dan mengirim laporan.</p></div>`;
}
function pendingView(){
  return `<div class="auth"><div style="text-align:center"><div style="display:inline-block;background:var(--hdr);border-radius:18px;padding:12px">${logo(58)}</div></div>
  <div class="card" style="text-align:center"><h2 style="margin:0 0 8px">Menunggu persetujuan</h2><p class="muted" style="margin:0">Akun <b>${esc(me.email)}</b> sudah masuk, tetapi belum disetujui admin. Hubungi admin Damkar Anda, lalu ketuk Periksa lagi.</p></div>
  <button class="btn" data-act="recheck">Periksa lagi</button><button class="btn ghost" data-act="logout">Keluar</button></div>`;
}
function splash(){return `<div class="splash">${logo(88)}<h1>Fire Command</h1><div>Damkar Lahan</div><div class="small" style="opacity:.85;margin-top:14px">Memuat aplikasi...</div></div>`}

function snapForm(f){const o=[];[...f.elements].forEach(e=>{if(!e.name||e.type==='file')return;if(e.type==='radio'||e.type==='checkbox')o.push([e.name,e.value,e.checked]);else o.push([e.name,null,e.value])});return o}
function restoreForm(f,o){o.forEach(x=>{[...f.elements].filter(e=>e.name===x[0]).forEach(e=>{if(e.type==='radio'||e.type==='checkbox'){if(e.value===x[1])e.checked=!!x[2]}else if(x[1]===null&&e.type!=='file')e.value=x[2]})})}
function render(){
  const sc=$('#screen'),top=sc?sc.scrollTop:0,same=sc&&sc.dataset.v===S.view,of=$('#form'),snap=(S.view==='form'&&of&&of.dataset.fkey===S.fkey)?snapForm(of):null;
  $('#root').innerHTML=S.view==='splash'?splash():S.view==='login'?login():S.view==='pending'?pendingView():shell();
  const n=$('#screen');if(n){n.dataset.v=S.view;if(same)n.scrollTop=top}
  if(snap&&$('#form'))restoreForm($('#form'),snap);
  if(S.view==='form')thumbs();
  if(S.sheet==='export')exRefresh();
}
function go(v,p){if(v==='form')S.fkey=uid();S.stack.push({view:S.view,p:S.p});S.view=v;S.p=p||{};S.drawer=false;S.sheet=null;render();const s=$('#screen');if(s)s.scrollTop=0}
function root(v){S.stack=[];S.view=v;S.p={};S.drawer=false;S.sheet=null;render()}
function back(){const x=S.stack.pop();if(x){S.view=x.view;S.p=x.p}else S.view='home';S.sheet=null;render()}

/* ---------- actions ---------- */
function saveReport(form){
  const t=S.p.t,T=TYPES[t],fd=new FormData(form),d={};let bad=null;
  T.f.forEach(f=>{if(f.t==='multi'){const o=(fd.get(f.k+'__lain')||'').toString().trim();d[f.k]=fd.getAll(f.k).concat(o?[o]:[]).join(', ')}else d[f.k]=(fd.get(f.k)||'').toString().trim()});
  document.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'));
  if(d.gps){const g=gpsOf({data:d});if(!g){$('#f_gps').classList.add('bad');$('#ferr').textContent='Koordinat tidak valid. Tulis lintang, bujur (contoh 0.35210, 102.04120) atau tempel tautan Google Maps yang memuat koordinat. Tautan pendek (maps.app.goo.gl) tidak bisa dibaca.';$('#f_gps').focus();return}d.gps=g.la.toFixed(5)+', '+g.lo.toFixed(5)}
  T.f.filter(f=>f.req).forEach(f=>{const v=d[f.k],n=parseFloat(v),e=$('#e_'+f.k);if(e)e.textContent='';
    if(v===''||isNaN(n)||n<(f.min==null?0:f.min)){bad=bad||f;if(e)e.textContent='Isi angka yang valid.';$('#f_'+f.k).classList.add('bad')}});
  T.f.filter(f=>(f.t==='multi'||f.t==='text')&&f.need).forEach(f=>{const e=$('#e_'+f.k);if(e)e.textContent='';if(!d[f.k]){bad=bad||f;if(e)e.textContent=f.t==='multi'?(f.needmsg||'Pilih minimal satu.'):'Wajib diisi.'}});
  if(bad){$('#ferr').textContent='Lengkapi isian yang ditandai.';const fe=$('#f_'+bad.k);if(fe)fe.focus();return}
  const ts=d.waktu?fromLocal(d.waktu):Date.now();
  if(ts>Date.now()+3e5){$('#ferr').textContent='Tanggal dan waktu tidak boleh di masa depan.';$('#f_waktu').focus();return}
  const p=prof();
  const rec={id:uid(),type:t,ts,author:p.name,authorId:me.id,data:d,photos:S.photos.slice(),status:'pending'};
  if(t==='api'){d.status='Dalam Penanganan';rec.updates=[{ts:ts,text:'Laporan diterima'}];rec.crew=[];rec.tools=(d.peralatan||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean)}
  try{setLocal(upsert(local(),rec))}catch(e){}
  if(t==='api'||(t==='patroli'&&d.hasil==='Ada temuan berat')||(t==='menara'&&d.asap==='Terlihat jelas'))addNotif({kind:'Penting',title:t==='api'?'Laporan kebakaran dibuat: '+d.lokasi:'Temuan perlu tindak lanjut',sub:sum(rec),ref:t==='api'?rec.id:undefined});
  S.photos=[];
  toast(online()?'Laporan tersimpan.':'Tersimpan di perangkat. Akan dikirim saat online.');
  S.stack=[{view:'home',p:{}}];S.view='mod';S.p={t:t};render();
  if(online()&&settings.auto)doSync();
}
function act(a,d,el,ev){
  switch(a){
  case'nav':if(d.v==='editprof')S.pphoto=null;go(d.v);if(d.v==='anggota'){S.members=null;loadMembers()}break;
  case'root':root(d.v);break;
  case'back':back();break;
  case'drawer':S.drawer=true;render();break;
  case'closedrawer':S.drawer=false;render();break;
  case'form':S.photos=[];go('form',{t:d.t,area:d.area});break;
  case'mod':go('mod',{t:d.t});break;
  case'pt':S.sheet={pt:d.id};render();break;
  case'gpspick':S.gp=parseCoord(($('#f_gps')||{}).value);S.sheet='gpspick';render();break;
  case'gpsmap':{const sat=ls.get('fc_sat',null);if(!sat||!ev)break;const r=el.getBoundingClientRect(),fx=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)),fy=Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height));
    const lo=sat.nw.lo+fx*(sat.se.lo-sat.nw.lo),la=sat.nw.la-fy*(sat.nw.la-sat.se.la);S.gp={la,lo};
    const W=360,H=Math.round(W*sat.h/sat.w),mk=$('#gp_mk');if(mk){mk.setAttribute('transform','translate('+(fx*W).toFixed(1)+' '+(fy*H).toFixed(1)+')');mk.removeAttribute('display')}
    const o=$('#gp_out');if(o)o.textContent=la.toFixed(5)+', '+lo.toFixed(5);const u=$('#gp_use');if(u)u.disabled=false;break}
  case'gpsuse':{if(!S.gp)break;const v=S.gp.la.toFixed(5)+', '+S.gp.lo.toFixed(5);S.sheet=null;render();const i=$('#f_gps');if(i)i.value=v;toast('Koordinat diisi: '+v);break}
  case'levelset':if(!canLevel())break;S.lvSel=curLv().k;S.sheet='level';render();break;
  case'lvpick':S.lvSel=d.k;document.querySelectorAll('.lvopt').forEach(b=>{const on=b.dataset.k===d.k;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});break;
  case'pbase':S.pbase=d.k;render();break;
  case'satset':S.satTmp=null;S.sheet='sat';render();break;
  case'satdel':ls.set('fc_sat',null);S.pbase='sat';S.sheet=null;toast('Citra satelit dihapus.');render();break;
  case'pcolor':S.pcolor=d.k;render();break;
  case'export':{const n=Date.now(),ym=dk(n).split('-').map(Number);S.drawer=false;S.ex={mods:d.t==='all'?ORDER.slice():[d.t],mode:'range',from:dk(n-29*D),to:dk(n),mon:ym[1],yr:ym[0],scope:S.scope,busy:false};S.sheet='export';render();break}
  case'exall':S.ex.mods=ORDER.slice();render();break;
  case'exmod':{const i=S.ex.mods.indexOf(d.t);if(i>=0)S.ex.mods.splice(i,1);else S.ex.mods.push(d.t);S.ex.mods.sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));render();break}
  case'exmode':S.ex.mode=d.m;render();break;
  case'expre':{const n=Date.now();S.ex.from=dk(n-(+d.n-1)*D);S.ex.to=dk(n);render();break}
  case'exscope':S.ex.scope=d.k;render();break;
  case'exdl':exDownload();break;
  case'scope':S.scope=d.k;render();break;
  case'seeall':S.lf=d.t;root('kegiatan');break;
  case'open':{const r=getRec(d.id);if(r&&r.type==='api'){S.dtab='Perkembangan';go('kej',{id:d.id})}else go('detail',{id:d.id});break}
  case'kej':S.dtab='Perkembangan';S.sheet=null;go('kej',{id:d.id});break;
  case'dtab':S.dtab=d.k;render();break;
  case'lf':S.lf=d.k;render();break;
  case'mapf':S.mapf=d.k;render();break;
  case'range':S.range=+d.d;render();break;
  case'ntab':S.ntab=d.k;render();break;
  case'readall':ls.set('fc_notif_'+me.id,notifs().map(n=>Object.assign({},n,{read:true})));render();break;
  case'nopen':{const l=notifs(),n=l.find(x=>x.id===d.id);if(n){n.read=true;ls.set('fc_notif_'+me.id,l);if(n.ref&&getRec(n.ref)){S.dtab='Perkembangan';go('kej',{id:n.ref});break}}render();break}
  case'toggleoff':settings.off=!settings.off;ls.set('fc_set',settings);render();if(online()&&settings.auto&&pending().length)doSync();else toast(settings.off?'Simulasi offline aktif.':'Kembali online.');break;
  case'toggleauto':settings.auto=!settings.auto;ls.set('fc_set',settings);render();break;
  case'sync':doSync(true);break;
  case'refresh':ls.set('fc_cursor',null);ls.set('fc_server',[]);toast('Memuat ulang data...');doSync(true);break;
  case'gsignin':signIn();break;
  case'recheck':recheck();break;
  case'mact':memberUpd(d.id,{aktif:d.v==='1'});break;
  case'logout':(async()=>{try{if(sb)await sb.auth.signOut({scope:'local'})}catch(e){}leave();render()})();break;
  case'del':setLocal(local().filter(r=>r.id!==d.id));toast('Laporan dihapus.');back();break;
  case'rmph':S.photos.splice(+d.i,1);thumbs();break;
  case'pickmap':S.sheet='map';render();break;
  case'pickblock':{S.sheet=null;render();const s=$('#f_lokasi');if(s)s.value=d.b;break}
  case'closesheet':S.sheet=null;render();break;
  case'mk':{const f=activeFires().find(x=>x.id===d.k);S.sheet={mk:f?{f}:MARK.find(m=>m.k===d.k)};render();break}
  case'addupd':S.sheet='upd';render();break;
  case'gps':case'gps2':{
    if(!navigator.geolocation){toast('GPS perangkat tidak tersedia di tampilan ini. Gunakan Pilih di peta atau ketik koordinatnya.');break}
    navigator.geolocation.getCurrentPosition(pos=>{const v=pos.coords.latitude.toFixed(5)+', '+pos.coords.longitude.toFixed(5);const i=$('#f_gps');if(i)i.value=v;else toast('Lokasi: '+v)},()=>toast('GPS perangkat tidak tersedia di tampilan ini. Gunakan Pilih di peta atau ketik koordinatnya.'),{timeout:5000});break}
  }
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]')&&!e.target.closest('button,[data-act]'))return;
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.classList.contains('overlay')&&e.target!==t)return;
  e.preventDefault();act(t.dataset.act,t.dataset,t,e);
});
document.addEventListener('change',async e=>{
  if(e.target.dataset&&e.target.dataset.mrole){memberUpd(e.target.dataset.mrole,{role:e.target.value});return}
  if(e.target.id==='f_gps'){const c=parseCoord(e.target.value);if(c)e.target.value=c.la.toFixed(5)+', '+c.lo.toFixed(5);return}
  if(S.ex&&['ex_from','ex_to','ex_mon','ex_yr'].includes(e.target.id)){const v=e.target.value,i=e.target.id;if(i==='ex_from'&&v)S.ex.from=v;if(i==='ex_to'&&v)S.ex.to=v;if(i==='ex_mon')S.ex.mon=+v;if(i==='ex_yr')S.ex.yr=+v;exRefresh();return}
  if(e.target.id==='satin'){const f=e.target.files[0];if(f){const o=await shrinkSat(f);if(o){S.satTmp=o;const pv=$('#satprev');if(pv)pv.innerHTML=`<img src="${o.img}" alt="Pratinjau citra" style="width:100%;height:100%;object-fit:cover">`}else toast('Gambar tidak bisa dibaca. Coba file JPG atau PNG lain.')}return}
  if(e.target.id==='pfin'){const f=e.target.files[0];if(f){const u=await shrink(f);if(u){S.pphoto=u;$('#pfprev').innerHTML=av(Object.assign({},prof(),{photo:u}),'big')}}return}
  if(e.target.id==='phin'||e.target.id==='phcam'){
    const all=[...e.target.files],room=3-S.photos.length,fs=all.slice(0,room);let ok=0,bad=0;
    for(const f of fs){const u=await shrink(f);if(u){S.photos.push(u);ok++}else bad++}
    thumbs();
    if(bad)toast('Foto tidak bisa dibaca. Coba format JPG atau PNG.');
    else if(all.length>room)toast('Maksimal 3 foto. '+ok+' foto ditambahkan.');
    else if(ok)toast(ok+' foto ditambahkan.');
    return}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-submit]');if(!f)return;e.preventDefault();
  const k=f.dataset.submit,fd=new FormData(f),err=$('#ferr');
  if(k==='saverep')saveReport(f);
  else if(k==='saveprof'){const o={name:(fd.get('name')||'').toString().trim()||me.name,regu:fd.get('regu'),shift:fd.get('shift'),area:fd.get('area'),photo:S.pphoto||prof().photo||'',dirty:true,complete:true};ls.set('fc_prof_'+me.id,o);me.name=o.name;S.pphoto=null;toast(online()?'Profil disimpan.':'Profil disimpan di perangkat. Dikirim saat online.');back();if(online())doSync()}
  else if(k==='invite'){const em=(fd.get('email')||'').toString().trim().toLowerCase(),role=fd.get('role');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){err.textContent='Tulis email yang valid.';return}
    if(!online()){err.textContent='Butuh koneksi internet.';return}
    (async()=>{const r=await sb.from('undangan').upsert({email:em,role},{onConflict:'email'});if(r.error){err.textContent='Gagal: '+why(r.error);return}
      const ex=await sb.from('profil').select('id').eq('email',em).maybeSingle();if(ex.data)await sb.from('profil').update({aktif:true,role}).eq('id',ex.data.id);
      f.reset();toast('Email ditambahkan.');loadMembers()})()}
  else if(k==='savelevel'){
    const cur=curLv(),nk=S.lvSel||cur.k,note=(fd.get('note')||'').toString().trim();
    if(!canLevel()){err.textContent='Hanya komandan atau admin yang boleh mengubah level.';return}
    if(nk===cur.k){err.textContent='Level tidak berubah. Pilih level lain.';return}
    if(!online()){err.textContent='Perubahan level butuh internet agar semua personel menerimanya.';return}
    (async()=>{const r=await sb.from('level_kesiagaan').insert({level:nk,dari:cur.k,catatan:note});
      if(r.error){err.textContent='Gagal: '+why(r.error);return}
      S.sheet=null;S.lvSel=null;await pull();toast('Level kesiagaan diubah menjadi '+lvOf(nk).n+'.');render()})();
  }
  else if(k==='savesat'){
    const t=S.satTmp||ls.get('fc_sat',null),nw=gpsOf({data:{gps:fd.get('nw')}}),se=gpsOf({data:{gps:fd.get('se')}});
    if(!t){err.textContent='Pilih gambar citra terlebih dahulu.';return}
    if(!nw||!se){err.textContent='Isi kedua koordinat sudut dengan format lintang, bujur.';return}
    if(!(nw.la>se.la&&nw.lo<se.lo)){err.textContent='Sudut kiri-atas harus lebih utara dan lebih barat daripada sudut kanan-bawah.';return}
    const o={img:t.img,w:t.w,h:t.h,nw,se};let ok=true;ls.set('fc_sat',o);
    S.satTmp=null;S.sheet=null;S.pbase='sat';render();
    toast(ok?'Citra satelit disimpan.':'Citra aktif sementara. Terlalu besar untuk disimpan permanen di perangkat.');
  }
  else if(k==='saveupd'){
    const r=getRec(S.p.id),text=(fd.get('text')||'').toString().trim(),st=fd.get('status'),luas=(fd.get('luas')||'').toString();
    if(!text&&st===r.data.status&&luas===r.data.luas&&!fd.get('crew')&&!fd.get('tool')&&!fd.get('tim')){err.textContent='Isi perkembangan atau ubah status.';return}
    const n=JSON.parse(JSON.stringify(r));
    if(text)n.updates.push({ts:Date.now(),text});
    if(st!==n.data.status){n.data.status=st;n.updates.push({ts:Date.now(),text:'Status diubah: '+st})}
    if(luas!==''&&luas!==n.data.luas){n.data.luas=luas}
    if(fd.get('crew'))n.crew=(n.crew||[]).concat([fd.get('crew').toString().trim()]);
    if(fd.get('tool'))n.tools=(n.tools||[]).concat([fd.get('tool').toString().trim()]);
    if(fd.get('tim'))n.data.tim=(n.data.tim?n.data.tim+', ':'')+fd.get('tim').toString().trim();
    n.status='pending';setLocal(upsert(local(),n));S.sheet=null;
    toast(online()?'Pembaruan disimpan.':'Pembaruan disimpan di perangkat.');render();
    if(online()&&settings.auto)doSync();
  }
});

/* ---------- boot ---------- */
(async function boot(){
  await ls.init();
  settings=ls.get('fc_set',{off:false,auto:true});
  render();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const n=reg.installing;if(n)n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)toast('Versi baru terpasang. Tutup lalu buka lagi aplikasi untuk memakainya.')})})}).catch(()=>{});
  }
  if(!cfgOk||!window.supabase){S.view='login';render();return}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me)setTimeout(()=>{leave();render()},0)});
  let sess=null,gerr=null;
  try{const r=await sb.auth.getSession();sess=r.data&&r.data.session;gerr=r.error}catch(e){gerr=e}
  if(sess)await enter(sess);
  else{const c=ls.get('fc_me',null);
    if(c&&(!navigator.onLine||(gerr&&isNet(gerr))))await enterOffline(c);
    else{S.view='login';render()}}
  setInterval(()=>{if(me&&me.aktif&&sb&&document.visibilityState==='visible'&&online())pull()},60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me&&me.aktif&&online())pull()});
  window.addEventListener('pagehide',()=>ls.flushNow());
})();
})();
</script>
